name: Check

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: hk pkl

      - uses: oven-sh/setup-bun@v2

      - run: brew install fd jj worktrunk
      - run: bun install
      - run: hk run check
      - name: Zsh integration tests
        run: |
          for test_file in test/dotfiles-overlay.test.zsh test/wt-*.test.zsh; do
            zsh "$test_file"
          done
