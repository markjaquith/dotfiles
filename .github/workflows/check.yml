name: Check

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: hk pkl

      - uses: oven-sh/setup-bun@v2

      - run: brew install fd fzf gum jj jq stow worktrunk markjaquith/tap/cowtree
      - run: bun install
      - run: npm ci --ignore-scripts --prefix home/.config/opencode
      - run: PATH="$PWD/node_modules/.bin:$PATH" hk run check --all
      - name: Upload check failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hk-output
          path: ~/.local/state/hk/output.log
          if-no-files-found: ignore
      # test/wt-*.test.zsh run inside `hk run check --all` via the wt-tests step.
      - name: Zsh integration tests
        run: zsh test/dotfiles-overlay.test.zsh
